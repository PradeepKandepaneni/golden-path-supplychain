name: supply-chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go vet ./...
      - run: go test ./... -v

  build-scan-sign:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image (immutable SHA tag)
        run: |
          SHA="${GITHUB_SHA::7}"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          docker build -t golden-path:$SHA --build-arg VERSION=$SHA .

      - name: Generate SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          image: golden-path:${{ env.SHA }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan image (print full table, block on FIXABLE Critical)
        uses: anchore/scan-action@v4
        id: scan
        with:
          image: golden-path:${{ env.SHA }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless-sign the SBOM
        run: |
          cosign sign-blob --yes sbom.spdx.json \
            --output-signature sbom.sig --output-certificate sbom.pem
          echo "Signed SBOM with workflow identity (keyless)."

      - name: Upload signed SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-signed
          path: |
            sbom.spdx.json
            sbom.sig
            sbom.pem

  enforce-policy:
    runs-on: ubuntu-latest
    needs: build-scan-sign
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with: { cluster_name: golden-path }
      - name: Install Kyverno
        run: |
          kubectl create -f https://github.com/kyverno/kyverno/releases/download/v1.12.5/install.yaml
          kubectl -n kyverno rollout status deployment/kyverno-admission-controller --timeout=180s
      - name: Apply namespace + hardening policy
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f policy/require-hardening.yaml
          sleep 10
      - name: Assert the BAD pod is REJECTED
        run: |
          if kubectl apply -f policy/bad-pod.yaml 2>err.txt; then
            echo "FAIL: cluster accepted an unhardened, :latest, root pod."
            exit 1
          fi
          echo "Policy correctly rejected the bad pod."
      - name: Assert the COMPLIANT deployment is ACCEPTED
        run: |
          sed -i "s|golden-path:ci|golden-path:hardened|" k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml --dry-run=server
          echo "Policy correctly admitted the hardened deployment."
